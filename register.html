<!DOCTYPE html>
<html dir="ltr" lang="pt-BR"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><title>Cadastro · GUSMARINHO Contador Online</title><link href="assets/img/favicon.svg" rel="icon" type="image/svg+xml"/><link href="assets/css/app.css" rel="stylesheet"/></head>
<body data-accent="emerald">
<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px">
<div class="card" style="max-width:400px;width:100%">
<div style="text-align:center;margin-bottom:24px">
<h1 style="font-size:24px;margin:0;font-weight:700">GUSMARINHO</h1>
<p class="muted" style="margin:4px 0 0">Cadastro de Escritório</p>
</div>
<form id="registerForm">
<div class="field"><label>Nome do Escritório</label><input class="control" type="text" id="nomeEscritorio" placeholder="Seu escritório" required/></div>
<div class="field"><label>E-mail</label><input class="control" type="email" id="email" placeholder="seu@email.com" required/></div>
<div class="field"><label>Senha</label><input class="control" type="password" id="senha" placeholder="••••••" required/></div>
<div id="msg" class="badge" style="display:none;margin-bottom:12px;padding:8px 12px"></div>
<button type="submit" class="btn primary block">Cadastrar</button>
</form>
<p style="text-align:center;margin-top:16px">Já tem conta? <a href="login.html">Entrar</a></p>
</div>
</div>
<script>
document.getElementById('registerForm').addEventListener('submit',async(e)=>{
e.preventDefault();
const nomeEscritorio=document.getElementById('nomeEscritorio').value;
const email=document.getElementById('email').value;
const senha=document.getElementById('senha').value;
const msg=document.getElementById('msg');
msg.style.display='none';
try{
const res=await fetch('/api/contador/cadastro',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nomeEscritorio,email,senha})});
const data=await res.json();
if(res.ok){msg.className='badge success';msg.textContent='Cadastro realizado! Redirecionando...';msg.style.display='block';setTimeout(()=>window.location.href='login.html',2000);}
else{msg.className='badge danger';msg.textContent=data.erro||'Erro ao cadastrar.';msg.style.display='block';}
}catch(err){msg.className='badge danger';msg.textContent='Erro ao conectar. Tente novamente.';msg.style.display='block';}
});
</script>
</body></html>
