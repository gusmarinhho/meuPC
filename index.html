<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resultados dos Sorteios · Lotofácil</title>
<link rel="stylesheet" href="assets/css/app.css">
<script src="assets/js/app.js"></script>
</head>
<body data-page="resultados">
<div id="site-header"></div>
<div class="site-main">
  <div class="page-title">Todos os Resultados da Lotofácil</div>
  <div class="page-sub">MazuSoft — consulte e importe os sorteios oficiais</div>
  <div id="alert-area"></div>

  <div class="controls-bar">
    <label>Concursos:</label>
    <input type="number" class="form-input" id="filtro-inicio" style="width:90px" min="1">
    <label>a</label>
    <input type="number" class="form-input" id="filtro-fim" style="width:90px" min="1">
    <button class="btn btn-primary btn-sm" onclick="aplicarFiltro()">OK</button>
    <span id="contagem" style="color:var(--text-muted);font-size:12px"></span>
    <label style="margin-left:auto">Ordem:</label>
    <select class="form-select" id="sel-ordem" style="width:140px" onchange="renderCards()">
      <option value="desc">Decrescente</option>
      <option value="asc">Crescente</option>
    </select>
    <button class="btn btn-outline btn-sm" onclick="atualizarOnline()">🔄 Atualizar Online</button>
    <button class="btn btn-outline btn-sm" onclick="exportarTXT()">📄 Exportar TXT</button>
    <button class="btn btn-outline btn-sm" onclick="exportarExcel()">📊 Exportar Excel</button>
  </div>

  <div class="grid grid-auto" id="cards-area">
    <div class="empty-state"><div class="spinner" style="margin:0 auto 12px"></div>Carregando concursos...</div>
  </div>
</div>
<script src="assets/js/resultados.js"></script>
</body>
</html>
