<!DOCTYPE html>
<html dir="ltr" lang="pt-BR"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><title>Login · GUSMARINHO Contador Online</title><link href="assets/img/favicon.svg" rel="icon" type="image/svg+xml"/><link href="assets/css/app.css" rel="stylesheet"/></head>
<body data-accent="emerald">
<script>if(localStorage.getItem('gusmarinho_token'))window.location.href='index.html';</script>
<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px">
<div class="card" style="max-width:400px;width:100%">
<div style="text-align:center;margin-bottom:24px">
<span class="brand-mark gusmarinho-mark" style="display:inline-flex;width:48px;height:48px;margin-bottom:12px"><span class="i"><svg role="img" viewBox="0 0 64 64" style="width:100%;height:100%"><defs><linearGradient id="gusmarinhoMarkLogin" x1="10" x2="54" y1="8" y2="56" gradientUnits="userSpaceOnUse"><stop stop-color="#22d3ee"></stop><stop offset=".52" stop-color="#2563eb"></stop><stop offset="1" stop-color="#7c3aed"></stop></linearGradient></defs><rect x="6" y="6" width="52" height="52" rx="18" fill="url(#gusmarinhoMarkLogin)"></rect><path d="M18 39.5 28.2 29l7 6.8L46.5 22" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="18" cy="39.5" r="3.2" fill="#fff"></circle><circle cx="28.2" cy="29" r="3.2" fill="#fff"></circle><circle cx="35.2" cy="35.8" r="3.2" fill="#fff"></circle><circle cx="46.5" cy="22" r="3.2" fill="#fff"></circle></svg></span></span>
<h1 style="font-size:24px;margin:0;font-weight:700">GUSMARINHO</h1>
<p class="muted" style="margin:4px 0 0">Contador Online</p>
</div>
<form id="loginForm">
<div class="field"><label>E-mail</label><input class="control" type="email" id="email" placeholder="seu@email.com" required/></div>
<div class="field"><label>Senha</label><input class="control" type="password" id="senha" placeholder="••••••" required/></div>
<div id="errorMsg" class="badge danger" style="display:none;margin-bottom:12px;padding:8px 12px"></div>
<button type="submit" class="btn primary block">Entrar</button>
</form>
<p style="text-align:center;margin-top:16px">Não tem conta? <a href="register.html">Cadastre-se</a></p>
</div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit',async(e)=>{
e.preventDefault();
const email=document.getElementById('email').value;
const senha=document.getElementById('senha').value;
const el=document.getElementById('errorMsg');
el.style.display='none';
try{
const res=await fetch('/api/contador/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,senha})});
const data=await res.json();
if(res.ok){localStorage.setItem('gusmarinho_token',data.token);localStorage.setItem('gusmarinho_nome',data.nomeEscritorio);localStorage.setItem('gusmarinho_contador_id',data.contadorId);window.location.href='index.html';}
else{el.textContent=data.erro||'Erro ao fazer login.';el.style.display='block';}
}catch(err){el.textContent='Erro ao conectar. Tente novamente.';el.style.display='block';}
});
</script>
</body></html>
